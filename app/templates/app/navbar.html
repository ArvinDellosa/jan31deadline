
   <style>

.navbar {
    width: 100%;
    max-width: 1200px; /* Adjust for better centering */
    background: #fff;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    padding: 15px 30px; /* Corrected padding */
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-radius: 50px;
    margin: 20px auto; /* Center the navbar */
    animation: fadeIn 0.8s ease-in-out;
}

/* Logo */
.navbar .logo {
    font-size: 24px;
    font-weight: 800;
    color: #007BFF;
    text-decoration: none;
}

/* Navigation Links */
.navbar .nav-links {
    display: flex;
    gap: 20px;
}

.navbar .nav-links a {
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    color: #555;
    transition: color 0.3s ease-in-out;
    padding: 8px 15px;
    border-radius: 6px;
}

.navbar .nav-links a:hover {
    background: #007BFF;
    color: white;
}

/* Mobile Menu (Hidden by Default) */
.navbar .menu-toggle {
    display: none;
    font-size: 24px;
    cursor: pointer;
}

/* Responsive Design */
@media (max-width: 768px) {
    .navbar {
        flex-direction: column;
        text-align: center;
    }

    .navbar .nav-links {
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
    }

    .navbar .menu-toggle {
        display: block;
    }
}

/* Fade-in Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

<header class="navbar">
    <a href="{% url 'home' %}" class="logo">MyWebsite</a>
    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'blog' %}">Blog</a>
        <a href="{% url 'register' %}">Register</a>
        <a href="{% url 'login' %}">Log In</a>
    </div>
    <div class="menu-toggle">&#9776;</div>
</header>
